server:
  port: 8081

spring:
  application:
    name: airport-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:airport_db}
    username: ${DB_USERNAME:airport_user}
    password: ${DB_PASSWORD:changeme}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

cache:
  airports:
    ttl-minutes: ${AIRPORTS_CACHE_TTL_MINUTES:60}

integrations:
  colombia-api:
    base-url: ${COLOMBIA_API_BASE_URL:https://api-colombia.com/api/v1}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

resilience4j:
  retry:
    instances:
      colombiaApi:
        max-attempts: 3
        wait-duration: 500ms
        # Backoff exponencial con jitter (sección 28): cada intento espera
        # ~2x el anterior, con hasta 50% de variación aleatoria para evitar
        # que múltiples instancias reintenten exactamente al mismo tiempo
        # ("thundering herd").
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - org.springframework.web.client.RestClientException
  circuitbreaker:
    instances:
      colombiaApi:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.itinerarios.airport.exception.ExternalProviderException

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{correlationId}]"
